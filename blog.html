<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog · Comunità Lautari</title>
  <meta name="description" content="Storie, approfondimenti e notizie dalla Comunità Lautari: la vita in comunità, il lavoro, le famiglie, come sostenerci.">
  <meta name="theme-color" content="#336739">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="blog">
  <script src="js/layout.js"></script>

  <main id="contenuto">
    <header class="phero phero--plain">
      <div class="wrap">
        <p class="eyebrow eyebrow--light">Blog</p>
        <h1>Storie dalla comunità</h1>
        <p class="phero__lead">Racconti, approfondimenti e notizie: com'è la vita in comunità, cosa fanno i ragazzi, come stare accanto a chi ami e come sostenerci.</p>
      </div>
    </header>

    <section class="listing blog" aria-labelledby="blog-title">
      <div class="wrap">
        <h2 id="blog-title" class="sr-only">Articoli</h2>
        <div id="articolo-evidenza"></div>
        <div class="filters" id="filtri-blog" role="toolbar" aria-label="Filtra per categoria"></div>
        <div class="igrid" id="elenco-articoli" aria-live="polite"></div>
      </div>
    </section>

    <section class="final">
      <div class="wrap final__in">
        <h2>Ogni storia qui è possibile grazie a chi ci sostiene.</h2>
        <button class="btn btn--dona btn--xl" data-dona><svg class="ico"><use href="#i-heart"/></svg> Dona ora</button>
      </div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
  <script src="js/blog.js"></script>
</body>
</html>
